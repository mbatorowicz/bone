[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bone"
version = "1.0.0"
description = "Kosmologiczna symulacja N-ciał ΛCDM — periodyczne pudło, solver PM, warunki początkowe 2LPT, mierzony błąd"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "cosmology",
  "n-body",
  "lambda-cdm",
  "particle-mesh",
  "large-scale-structure",
  "initial-conditions",
  "power-spectrum",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bone = "bone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# frontend mieszka wewnątrz pakietu, więc wheel go zawiera i `bone studio`
# działa też po zwykłej instalacji, nie tylko w trybie edytowalnym
[tool.setuptools.package-data]
"bone.studio" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]
