[package]
name = "bone-cosmo"
version = "0.1.0"
edition = "2021"
description = "ΛCDM N-body na GPU użytkownika — Planck 2018, Particle-Mesh"
license = "MIT"
authors = ["mbatorowicz"]

[[bin]]
name = "BoneCosmo"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui = "0.31"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
rustfft = "6.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[package.metadata.wix]
name = "Bone Cosmo"
upgrade-guid = "a7c3e1f0-4b2d-4e8a-9c11-b01e00000001"
path-guid = "a7c3e1f0-4b2d-4e8a-9c11-b01e00000002"
