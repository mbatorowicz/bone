<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bone Studio — SR</title>
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <aside>
      <h1>BONE SR</h1>
      <p class="teza" id="teza">Czysta grawitacja relatywistyczna — otwarta przestrzeń, bez ścian i warstwy społecznej.</p>
      <div class="presets" id="presets"></div>
      <div class="row">
        <button class="primary" id="btnStart">Uruchom</button>
        <button id="btnResume">Kontynuuj</button>
        <button class="danger" id="btnStop">Stop</button>
      </div>
      <div class="mode">
        <button id="modeLive" class="active">LIVE</button>
        <button id="modeReplay">REPLAY</button>
      </div>
      <div class="row" id="replayControls" style="display:none">
        <button id="btnPlay">Play</button>
        <input type="range" id="scrub" min="0" max="0" value="0" style="flex:1" />
        <label>× <input type="number" id="replaySpeed" value="1" min="0.25" max="8" step="0.25" style="width:4rem" /></label>
      </div>
      <div id="panel"></div>
      <div class="row"><button id="btnApply">Zastosuj (runtime)</button></div>
      <div id="status">…</div>
    </aside>
    <div id="view">
      <canvas id="c"></canvas>
      <div id="hud">
        <div>⟨γ⟩ <b id="hG">—</b></div>
        <div>γ<sub>max</sub> <b id="hGmax">—</b></div>
        <div>r½/r₀ <b id="hR">—</b></div>
        <div>|L| <b id="hL">—</b></div>
        <div>⟨v⟩/c <b id="hV">—</b></div>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
